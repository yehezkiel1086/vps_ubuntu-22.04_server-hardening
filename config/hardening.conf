# =============================================================================
# hardening.conf — Configuration for harden.sh
# =============================================================================
# Edit these values before running the script.
# All variables are sourced by harden.sh and its modules.
# =============================================================================

# ── SSH ───────────────────────────────────────────────────────────────────────
# Port to listen on. Change from default 22 to reduce bot noise.
SSH_PORT=2299

# Your public key (paste the full contents of your ~/.ssh/id_ed25519.pub or similar)
# The script will install this for DEPLOY_USER before disabling password auth.
DEPLOY_PUBKEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICHANGE_THIS_TO_YOUR_ACTUAL_PUBLIC_KEY user@host"

# Allowed SSH users (space-separated). Only these users can SSH in.
SSH_ALLOWED_USERS="deploy"

# Max authentication attempts before disconnect
SSH_MAX_AUTH_TRIES=3

# Idle session timeout in seconds (300 = 5 minutes)
SSH_CLIENT_ALIVE_INTERVAL=300
SSH_CLIENT_ALIVE_COUNT_MAX=2

# Login grace time in seconds
SSH_LOGIN_GRACE_TIME=30

# ── Users ─────────────────────────────────────────────────────────────────────
# Non-root user created for daily operations
DEPLOY_USER="deploy"

# Lock the root account password after hardening (recommended: true)
LOCK_ROOT_PASSWORD=true

# ── Firewall (ufw) ────────────────────────────────────────────────────────────
# Open HTTP/HTTPS ports (set to false if this is not a web server)
OPEN_HTTP=true
OPEN_HTTPS=true

# Additional ports to open (space-separated, e.g. "3000 8080")
EXTRA_OPEN_PORTS=""

# Restrict SSH to a specific IP? Leave empty to allow from anywhere.
# Example: SSH_ALLOWED_IP="203.0.113.42"
SSH_ALLOWED_IP=""

# ── Fail2ban ──────────────────────────────────────────────────────────────────
# How long to ban an IP (supports h/m/d: "1h", "30m", "1d")
F2B_BANTIME="2h"

# Window to count failures within
F2B_FINDTIME="10m"

# Number of failures before ban
F2B_MAXRETRY=3

# ── Automatic Updates ─────────────────────────────────────────────────────────
# Email address for unattended-upgrades notifications (leave empty to disable)
ALERT_EMAIL=""

# Auto-reboot after kernel updates? false = safer for production
AUTO_REBOOT=false

# ── Time Synchronization ──────────────────────────────────────────────────────
# Timezone for the server (use 'timedatectl list-timezones' to find yours)
# Recommend UTC for servers — convert in the application layer
TIMEZONE="UTC"

# Use chrony instead of systemd-timesyncd (true = more accurate, adds a package)
USE_CHRONY=true

# ── Services to Disable ───────────────────────────────────────────────────────
# Each can be set to true (disable it) or false (leave it running)
DISABLE_SNAPD=true
DISABLE_AVAHI=true
DISABLE_CUPS=true
DISABLE_MODEM_MANAGER=true
DISABLE_WHOOPSIE=true       # Ubuntu crash reporter — not needed on a server
DISABLE_APPORT=true         # Error reporting — not needed on a server

# ── Kernel / sysctl Hardening ─────────────────────────────────────────────────
# Apply recommended sysctl hardening parameters (true/false)
APPLY_SYSCTL_HARDENING=true

# ── Logging ───────────────────────────────────────────────────────────────────
# Keep logrotate weekly logs for N weeks
LOG_ROTATE_WEEKS=52

# Enable process accounting (tracks every command run on the system)
ENABLE_PROCESS_ACCOUNTING=true

# Enable auditd file-level audit trails
ENABLE_AUDITD=true

# ── Lynis Audit ───────────────────────────────────────────────────────────────
# Run lynis audit at the end and include score in report
ENABLE_LYNIS_AUDIT=true
